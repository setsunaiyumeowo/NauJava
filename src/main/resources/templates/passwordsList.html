<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password List</title>
</head>
<body>
<form th:action="@{/logout}" method="post">
    <button type="submit">Выйти</button>
</form>

<h1>Generated passwords</h1>
<table border="1">
    <tr>
        <th>ID</th>
        <th>Label</th>
        <th>Length</th>
        <th>User</th>
        <th>Algorithm</th>
        <th>Category</th>
        <th>Created</th>
    </tr>
    <tr th:each="p : ${passwords}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.label}"></td>
        <td th:text="${p.length}"></td>
        <td th:text="${p.user.login}"></td>
        <td th:text="${p.algorithm.name}"></td>
        <td th:text="${p.category != null ? p.category.title : '—'}"></td>
        <td th:text="${p.createdAt}"></td>
    </tr>
</table>
</body>
</html>
