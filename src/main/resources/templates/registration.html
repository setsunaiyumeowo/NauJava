<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
</head>
<body>
<h1>Регистрация</h1>

<div th:if="${message}" style="color: red" th:text="${message}"></div>

<form th:action="@{/registration}" method="post">
    <div><label>Логин: <input type="text" name="login" th:value="${login}" required></label></div>
    <div><label>Email: <input type="email" name="email" th:value="${email}" required></label></div>
    <div><label>Пароль (не меньше 6 символов): <input type="password" name="password" required></label></div>
    <div><button type="submit">Зарегистрироваться</button></div>
</form>

<p>Уже есть аккаунт? <a th:href="@{/login}">Войти</a></p>
</body>
</html>
