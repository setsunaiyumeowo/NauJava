<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>
<body>
<h1>Вход в PassGen</h1>

<div th:if="${param.error}" style="color: red">Неверный логин или пароль</div>
<div th:if="${param.logout}">Вы вышли из системы</div>
<div th:if="${param.registered}" style="color: green">Регистрация прошла успешно, войдите</div>

<form th:action="@{/login}" method="post">
    <div><label>Логин: <input type="text" name="username" required></label></div>
    <div><label>Пароль: <input type="password" name="password" required></label></div>
    <div><button type="submit">Войти</button></div>
</form>

<p>Нет аккаунта? <a th:href="@{/registration}">Зарегистрироваться</a></p>
</body>
</html>
